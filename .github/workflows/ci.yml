name: CI

# Next 16 does not run ESLint during `next build`, so a green build is not
# evidence of a green repo. All three checks run on every push.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Delivery keys are not needed to build — src/lib/env.ts parses
          # lazily so an unconfigured environment still compiles.
          NEXT_PUBLIC_SITE_URL: https://artspaces.design
